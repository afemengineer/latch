[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "latch-agent"
version = "0.1.0"
description = "Local-first authority control for AI agents"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "afemengineer" }]
dependencies = [
  "fastapi>=0.117",
  "PyYAML>=6.0.2",
  "uvicorn>=0.35",
]

[project.scripts]
latch-demo = "latch.api.cli:main"

[project.optional-dependencies]
os-secrets = [
  "keyring>=25.6",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "httpx>=0.28",
  "pyright>=1.1.400",
  "ruff>=0.11",
  "types-PyYAML>=6.0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/latch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src"]
reportUnknownMemberType = "error"
reportUnknownArgumentType = "error"
reportUnknownVariableType = "error"
